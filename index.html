<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop Mascot</title>
    <link rel="stylesheet" href="style.css" />
    <script src="shared/config-rules.js" defer></script>
    <script src="shared/concurrency.js" defer></script>
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <main id="stage" aria-label="デスクトップマスコット">
      <div id="mascot" role="img" aria-label="デスクトップマスコット">
        <img id="mascot-image" alt="" draggable="false" />
      </div>
      <p id="status" class="status" role="status" hidden></p>
    </main>
  </body>
</html>
